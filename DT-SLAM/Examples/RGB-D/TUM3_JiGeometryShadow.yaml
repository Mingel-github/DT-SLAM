%YAML:1.0

# GJ-1 shadow-only implementation of the Ji et al. 2021 depth-clustering
# component. It emits labels, timing, CSV statistics, and optional debug
# images. It does not classify dynamic clusters or directly mutate SLAM
# state. Its synchronous runtime remains part of end-to-end latency.

Camera.fx: 535.4
Camera.fy: 539.2
Camera.cx: 320.1
Camera.cy: 247.6

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 640
Camera.height: 480
Camera.fps: 30.0
Camera.bf: 40.0
Camera.RGB: 1

ThDepth: 40.0
DepthMapFactor: 5000.0

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Geometry.Enable: 0

JiGeometry.Enable: 1

# [P] Ji et al. report N=24 for 640x480.
JiGeometry.Clusters: 24

# [E] The paper does not specify initialization, attempts, stopping
# criteria, or random seed. These values make the engineering baseline
# explicit and reproducible.
JiGeometry.KMeansMaxIterations: 20
JiGeometry.KMeansEpsilon: 0.001
JiGeometry.KMeansAttempts: 1
JiGeometry.RandomSeed: 2021
JiGeometry.LogEveryN: 10
JiGeometry.DebugSave: 1
JiGeometry.DebugEveryN: 10

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
