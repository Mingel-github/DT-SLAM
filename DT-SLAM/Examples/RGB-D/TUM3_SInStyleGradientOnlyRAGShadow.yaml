%YAML:1.0

# TUM fr3 S1 shadow: author final reference, clean-room coarse-to-fine
# initial regions, gradient-depth split, and gradient-only RAG merge.
# No dynamic decision and no SLAM filtering.
Camera.fx: 535.4
Camera.fy: 539.2
Camera.cx: 320.1
Camera.cy: 247.6
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0
Camera.width: 640
Camera.height: 480
Camera.fps: 30.0
Camera.bf: 40.0
Camera.RGB: 1
ThDepth: 40.0
DepthMapFactor: 5000.0

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Geometry.Enable: 0
Geometry.RegionGrowEnable: 0
Geometry.DebugSave: 0

SInStyle.ShadowEnable: 1
SInStyle.Backend: "reference_replay"
SInStyle.ReferenceBackend: "brox_cuda"
SInStyle.ReferenceDirectory: "."
SInStyle.ReferenceMaskSuffix: "_mask_final.png"
SInStyle.RequireLabels: 1
SInStyle.LogEveryN: 10
SInStyle.CsvPath: ""

SInStyle.NativeInitialRegionsEnable: 1
SInStyle.NativeClusterPixelDivisor: 25600.0
SInStyle.NativeMaximumDepthM: 6.0
SInStyle.NativeKMeansMaxIterations: 4
SInStyle.NativeKMeansEpsilon: 0.07
SInStyle.NativeKMeansAttempts: 1
SInStyle.NativeKMeansSeed: 2025
SInStyle.NativeCoarseToFine: 1
SInStyle.NativePyramidLevels: 4
SInStyle.NativeTemporalInitialization: 1
SInStyle.NativeTemporalCommitStartInputIndex: 1
SInStyle.NativeInitialOutputDirectory: ""

SInStyle.NativeGradientSplitEnable: 1
SInStyle.NativeGradientRelativeThreshold: 0.025
SInStyle.NativeGradientAbsoluteThresholdM: 0.08
SInStyle.NativeGradientMedianRadius: 2
SInStyle.NativeGradientMinimumSupport: 5
SInStyle.NativeGradientConnectivity: 8
SInStyle.NativeGradientSmallComponentAuditPixels: 80
SInStyle.NativeGradientOutputDirectory: ""

# [L] Paper Table-II profile except the explicitly documented clean-room
# fake-boundary, histogram-domain, and missing plane-edge adaptations [A].
SInStyle.NativeRAGMergeEnable: 1
SInStyle.NativeRAGAdjacencyDilationRadius: 3
SInStyle.NativeRAGHistogramBins: 256
SInStyle.NativeRAGAdjacencyThresholdPixels: 200.0
SInStyle.NativeRAGAreaDepthScoreWeight: 0.05
SInStyle.NativeRAGFakeEdgeWeight: 0.01
SInStyle.NativeRAGLargeRegionWeight: 0.7
SInStyle.NativeRAGMiddleRegionWeight: 1.0
SInStyle.NativeRAGSmallRegionWeight: 2.0
SInStyle.NativeRAGMergeThreshold: 0.9
SInStyle.NativeRAGDepthRejectThreshold: 0.2
SInStyle.NativeRAGHighMiddleFraction: 0.7
SInStyle.NativeRAGLargeFraction: 0.5
SInStyle.NativeRAGSmallFraction: 0.7
SInStyle.NativeRAGOutputDirectory: ""

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
