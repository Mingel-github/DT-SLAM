%YAML:1.0

# TUM fr1 G0-2A/G0-2P static-scene diagnostic.
#
# ORB-SLAM2 tracking keeps the calibrated Freiburg 1 RGB model below.
# Geometry operates on the raw, OpenNI-registered RGB/depth PNG pixel domain.
# The TUM RGB-D benchmark explicitly recommends the ROS default zero-distortion
# pinhole model for point-cloud conversion because rectifying pre-registered
# depth is not straightforward.

Camera.fx: 517.306408
Camera.fy: 516.469215
Camera.cx: 318.643040
Camera.cy: 255.313989

Camera.k1: 0.262383
Camera.k2: -0.953104
Camera.p1: -0.005358
Camera.p2: 0.002628
Camera.k3: 1.163314

Camera.width: 640
Camera.height: 480
Camera.fps: 30.0
Camera.bf: 40.0
Camera.RGB: 1

ThDepth: 40.0
DepthMapFactor: 5000.0

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Geometry.Enable: 1
Geometry.LogEveryN: 30
Geometry.ResidualThresholdM: 0.10
Geometry.RegionGrowEnable: 0
Geometry.RegionDepthThresholdM: 0.05
Geometry.DebugSave: 1
Geometry.DebugEveryN: 30

# Dedicated raw registered depth-warp model; zero distortion is implicit.
Geometry.Camera.fx: 525.0
Geometry.Camera.fy: 525.0
Geometry.Camera.cx: 319.5
Geometry.Camera.cy: 239.5

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
